<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280">
<defs>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#0a3a52" stroke-width="0.5" opacity="0.7"/>
  </pattern>
  <radialGradient id="core">
    <stop offset="0" stop-color="#eaffff"/>
    <stop offset="0.45" stop-color="#00e5ff"/>
    <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="scan" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#00e5ff" stop-opacity="0"/>
    <stop offset="0.5" stop-color="#00e5ff" stop-opacity="0.16"/>
    <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="fade" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#00e5ff"/>
    <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
  </linearGradient>
  <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
    <feGaussianBlur stdDeviation="3" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <clipPath id="clip"><rect width="1000" height="280" rx="12"/></clipPath>
</defs>
<style>
  .r1 { transform-origin: 140px 140px; animation: spin 26s linear infinite; }
  .r2 { transform-origin: 140px 140px; animation: spin 18s linear infinite reverse; }
  .r3 { transform-origin: 140px 140px; animation: spin 60s linear infinite; }
  .pulse { animation: pulse 3s ease-in-out infinite; }
  .blink { animation: blink 1.4s steps(2, start) infinite; }
  .scan { animation: sweep 7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes pulse { 50% { opacity: 0.5; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes sweep { 0% { transform: translateX(-200px); } 100% { transform: translateX(1000px); } }
</style>

<g clip-path="url(#clip)">
  <rect width="1000" height="280" fill="#020b14"/>
  <rect width="1000" height="280" fill="url(#grid)"/>
  <rect class="scan" x="0" y="0" width="200" height="280" fill="url(#scan)"/>
</g>
<rect x="0.5" y="0.5" width="999" height="279" rx="12" fill="none" stroke="#0a3a52"/>

