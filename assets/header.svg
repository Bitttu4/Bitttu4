<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220">
<defs>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="0.9" fill="#22303f"/>
  </pattern>
  <linearGradient id="vig" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#0b0f14" stop-opacity="1"/>
    <stop offset="0.45" stop-color="#0b0f14" stop-opacity="0.92"/>
    <stop offset="1" stop-color="#0b0f14" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="rule" x1="0" x2="1" y1="0" y2="0">
    <stop offset="0" stop-color="#4cc9f0"/>
    <stop offset="1" stop-color="#4cc9f0" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="clip"><rect width="1000" height="220" rx="10"/></clipPath>
</defs>
<style>
  .slow { transform-origin: 860px 110px; animation: spin 120s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .sans { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .mono { font-family: "SFMono-Regular", Consolas, "Courier New", monospace; }
</style>

<g clip-path="url(#clip)">
  <rect width="1000" height="220" fill="#0b0f14"/>
  <rect width="1000" height="220" fill="url(#dots)"/>

  <!-- quiet geometric accent, right side -->
  <g fill="none" stroke="#4cc9f0">
    <circle cx="860" cy="110" r="38" opacity="0.30"/>
    <circle cx="860" cy="110" r="70" opacity="0.18"/>
    <circle cx="860" cy="110" r="104" opacity="0.11"/>
    <circle cx="860" cy="110" r="140" opacity="0.07"/>
    <g class="slow"><circle cx="860" cy="110" r="88" stroke-dasharray="2 10" opacity="0.35"/></g>
    <path d="M860 20 V200 M770 110 H950" opacity="0.15"/>
  </g>
  <circle cx="860" cy="110" r="3" fill="#4cc9f0"/>

  <rect width="640" height="220" fill="url(#vig)"/>
</g>
<rect x="0.5" y="0.5" width="999" height="219" rx="10" fill="none" stroke="#1c2733"/>

<rect x="48" y="61" width="24" height="2" fill="#4cc9f0"/>
<text class="mono" x="84" y="66" font-size="12" fill="#6b7a8a" letter-spacing="4">SYSTEMS  /  MACHINE LEARNING</text>
<text class="sans" x="46" y="126" font-size="46" font-weight="600" fill="#e6edf3" letter-spacing="0.5">Aarya Patel</text>
<text class="sans" x="48" y="158" font-size="16" fill="#8b98a8">Building developer tools, AI/ML projects and system-level software.</text>
<rect x="48" y="180" width="260" height="1" fill="url(#rule)"/>
<text class="mono" x="48" y="201" font-size="12" fill="#6b7a8a" letter-spacing="1">Python · C/C++ · Java  —  Linux internals · Deep learning</text>
</svg>
